<div class="">
  
  <div class="flex flex-col gap-5 overflow-y-auto max-h-[500px] pr-1">
    @for (item of items(); track item.id) {
      <div class="flex items-center  border-black/10 border-b dark:border-white/10 pb-4 justify-between gap-4 group">
        
        <div class="flex items-center  justify-center gap-4">
          @if (item.hasVideo && item.videoUrl) {
            <div class="relative w-20 h-20 rounded-2xl overflow-hidden border border-white/10">
              @if (playing(item)) {
                <video 
                  [src]="item.videoUrl" 
                  class="absolute inset-0 w-full h-full object-cover"
                  autoplay
                  playsinline
                  (ended)="onVideoEnded(item)"
                  (click)="$event.stopPropagation()"
                  controls
                ></video>
              } @else {
                <img 
                  [src]="item.imageUrl" 
                  [alt]="item.title" 
                  class="w-full h-full object-cover"
                  (click)="onThumbnailClick(item)"
                />
                <button 
                  class="absolute inset-0 flex items-center justify-center bg-black/20 group"
                  (click)="$event.stopPropagation(); onPlayClick(item)"
                  aria-label="Play video"
                >
                  <div class="w-8 h-8 rounded-full bg-[#FF4500] flex items-center justify-center transition-transform duration-200 group-hover:scale-110">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-4 h-4 ml-0.5 text-white">
                      <path d="M8 5v14l11-7z"/>
                    </svg>
                  </div>
                </button>
              }
            </div>
          } @else {
            <img [src]="item.imageUrl" [alt]="item.title" class="w-20  h-20 rounded-2xl object-cover border border-white/10" />
          }
          <div class="flex flex-col">
            <h4 class="dark:text-white text-black font-bold text-base">{{ item.title }}</h4>
            
            @if (item.subTitle) {
              <span class="text-gray-400 dark:text-[#F3F3F4] text-xs mt-0.5">{{ item.subTitle }}</span>
            }
            
            <p class="text-gray-500 dark:text-[#F3F3F4] text-xs mt-1 max-w-[200px] line-clamp-2">{{ item.description }}</p>
          </div>
        </div>

        <div class="flex-shrink-0 w-8 h-8 flex items-center justify-center">
          @if (item.hasVideo) {
            <button class="bg-[#FF4500] hover:bg-[#e03d00] text-white p-2 rounded-full flex items-center justify-center w-8 h-8 transition-colors duration-200 border-0 cursor-pointer" (click)="onPlayClick(item)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-4 h-4 ml-0.5">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </button>
          }
        </div>

      </div>
    } @empty {
      <p class="text-gray-500 text-sm text-center py-4">No items found</p>
    }
  </div>

</div>
