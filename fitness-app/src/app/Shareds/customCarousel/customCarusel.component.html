<div class="w-full max-w-6xl mx-auto my-8 px-4">
  <p-carousel 
    [value]="groupedItems()" 
    [numVisible]="3" 
    [numScroll]="1" 
    [circular]="true"
    [responsiveOptions]="responsiveOptions()">
    
    <ng-template pTemplate="item" let-group>
<div class="flex p-1 gap-6" [ngClass]="{'flex-col': rowsCount() > 1, 'flex-row': rowsCount() === 1}">
    @for (meal of group; track meal.idMeal) {
        <div class="w-full">
            <app-custom-card
                [title]="meal.title" 
                [imageSrc]="meal.imageSrc"
                (cardClicked)="onCardAction(meal)"> 
            </app-custom-card>
        </div>
    }
</div>
    </ng-template>
  </p-carousel>
</div>
