<div class="w-full mx-auto my-8 px-4">
  <p-carousel
  [value]="groupedItems()"
  [numVisible]="groupedItems().length === 1 ? 1 : 3"
  [numScroll]="1"
  [circular]="autoPlay()"
  [autoplayInterval]="autoPlay() ? 2000 : 0"
  [responsiveOptions]="responsiveOptions()"
>
    
    <ng-template pTemplate="item" let-group>
      <div class="flex p-2 gap-4" [ngClass]="{'flex-col': rowsCount() > 1, 'flex-row': rowsCount() === 1}"> 
         @for (meal of group; track meal.id) {
          <div class="w-full">
            <app-custom-card
  [id]="meal.id"
  [title]="meal.title"
  [imageSrc]="meal.imageSrc"
  (cardClicked)="onCardAction($event)">
</app-custom-card>
          </div>
        }
      </div>
    </ng-template>
  </p-carousel>
</div>
