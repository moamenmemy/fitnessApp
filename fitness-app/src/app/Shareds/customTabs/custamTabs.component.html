<div class="tabs-wrapper w-full flex items-center justify-center overflow-x-auto no-scrollbar py-2 px-2">
  <div class="tabs-container flex items-center gap-2 whitespace-nowrap  py-2">

    @for (tab of tabsData(); track tab.id || $index) {
      <button
        (click)="selectTab(tab)"
        [class.active]="activeTabInternal() === tab.id"
        class="tab-button">

        {{ getTabLabel(tab) }}

      </button>
    }

  </div>
</div>
