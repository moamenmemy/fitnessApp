<div class="w-full flex items-center justify-center overflow-x-auto no-scrollbar py-2">
  <div class="flex items-center gap-2 md:gap-4 p-1.5 rounded-full backdrop-blur-sm ">
    
    @for (tab of tabsData(); track tab.id) {
      <button 
        (click)="selectTab(tab)"
        [class]="activeTabInternal() === tab.id 
          ? ' text-[#f15a24] font-extrabold' 
          : 'text-gray-300 hover:text-[#f15a24] font-medium bg-transparent'"
        class="px-5 py-2 text-xs md:text-sm font-sans tracking-wide uppercase rounded-full transition-all duration-300 ease-in-out cursor-pointer whitespace-nowrap border-0 outline-none">
        {{ getTabLabel(tab) }}
      </button>
    }

  </div>
</div>
