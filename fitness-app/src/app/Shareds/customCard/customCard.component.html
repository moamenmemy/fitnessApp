<div (click)="onCardClick()" class="group relative w-full h-[250px] md:h-[399px] rounded-[24px] overflow-hidden shadow-xl cursor-pointer bg-zinc-900 border border-zinc-800 ح-">      
      <img 
        [src]="imageSrc()"
       [alt]="title()" 
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
      />
<div class="absolute bottom-0 left-0 w-full bg-black/40 backdrop-blur-md border-t border-white/10 p-5 flex flex-col justify-end gap-2">
    
    <h3 class="text-white font-bold text-lg uppercase tracking-wide truncate">
        {{ title() }}
    </h3>

    <div class="flex items-center justify-start mt-3 gap-4">
        <span class="text-[#f15a24] font-sans text-sm font-bold tracking-wide">
            Explore
        </span>
        
        <div 
         class="w-7 h-7 bg-[#f15a24] rounded-full flex items-center justify-center transition-transform duration-300 group-hover:translate-x-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-3 h-3 text-white">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
            </svg>
        </div>
    </div>
</div>
    </div>
