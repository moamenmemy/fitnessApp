<div class="group w-full max-w-[280px] bg-[#1a1a1a] rounded-[24px] overflow-hidden shadow-xl cursor-pointer flex flex-col relative aspect-[4/5]">
  
  <div class="absolute inset-0 w-full h-full overflow-hidden">
    <img 
      [src]="imageSrc()" 
      [alt]="title()" 
      class="w-full h-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-110" 
    />
  </div>

  <div class="absolute bottom-0 left-0 w-full bg-black/40 backdrop-blur-md border-t border-white/10 p-5 pt-4 flex flex-col justify-between min-h-[90px]">
    
    <h3 class="m-0 text-white font-sans text-base font-extrabold uppercase tracking-wider line-clamp-1">
      {{ title() }}
    </h3>
    
    <div class="flex items-center justify-start mt-3 gap-2">
      <span class="text-[#f15a24] font-sans text-sm font-bold tracking-wide">
        {{ subText() }}
      </span>
      
      <div class="w-6 h-6 bg-[#f15a24] rounded-full flex items-center justify-center transition-transform duration-300 group-hover:translate-x-1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-3 h-3 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
        </svg>
      </div>
    </div>

  </div>

</div>
