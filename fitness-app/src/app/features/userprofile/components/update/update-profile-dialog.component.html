<p-dialog
  [visible]="visible()"
  (onHide)="close()"
  [modal]="true"
 [style]="{ width: '100%', height: '100%' }"
>

  <div class="w-full max-w-[486px] mx-auto border bg-[#242424]/60 
              border-white/20 rounded-[50px] p-[20px] shadow-2xl 
              backdrop-blur-md flex flex-col gap-4">

    <!-- GOAL -->
    @if(type() === 'goal') {
      @for(goal of goals(); track goal.id) {
        <app-radio
          [label]="goal.text"
          [value]="goal.id"
          [checked]="localData().goal === goal.id"
          (checkedChange)="updateField('goal', $event)"
        />
      }
    }

    <!-- ACTIVITY -->
    @if(type() === 'activityLevel') {
      @for(a of activityLevel(); track a.id) {
        <app-radio
          [label]="a.text"
          [value]="a.id"
          [checked]="localData().activityLevel === a.id"
          (checkedChange)="updateField('activityLevel', $event)"
        />
      }
    }

    <!-- WEIGHT -->
    @if(type() === 'weight') {
      <app-scroll
        [label]="'kg'"
        [min]="30"
        [max]="300"
        [step]="1"
        (valueChange)="updateField('weight', $event)"
      />
    }

    <!-- HEIGHT -->
 

    <button
      (click)="submit()"
      class="w-full mt-5 bg-[var(--main-color)] text-white py-3 rounded-full"
    >
      Save
    </button>

  </div>

</p-dialog>
