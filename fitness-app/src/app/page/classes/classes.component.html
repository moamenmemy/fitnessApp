
<div class="min-h-screen  p-8 text-white">
  
  <h2 class="text-2xl font-bold text-center mb-6">Test My New Custom Carousel</h2>

  <app-custom-carusel 
    [carouselItems]="testMeals()"
    (itemActionClicked)="handleCarouselClick($event)">
  </app-custom-carusel>

</div>
<app-custom-card 
    [title]="singleMeal.titleName" 
    [imageSrc]="singleMeal.imageCover" 
    [subText]="singleMeal.btnText">
  </app-custom-card>

<app-custom-tabs [tabsData]="mealTabs"></app-custom-tabs>
