<div class="flex flex-col items-center justify-center p-6">

  <div class="flex items-center justify-between bg-[#1A1A1A]/80 backdrop-blur-md rounded-full p-1 mb-6 w-full max-w-md border border-white/5">
    @for (tab of classTabs(); track tab) {
      <button 
        (click)="onTabChange(tab)"
        [class.bg-[#FF4500]]="currentTab() === tab"
        [class.text-white]="currentTab() === tab"
        [class.text-gray-400]="currentTab() !== tab"
        class="flex-1 text-center py-2 px-4 rounded-full text-sm font-medium bg-transparent border-0 outline-none cursor-pointer transition-all duration-300">
        {{ tab }}
      </button>
    }
  </div>

  <app-custom-list [items]="filteredClassItems()"></app-custom-list>

</div>
