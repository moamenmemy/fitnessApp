<button
  type="button"
  [disabled]="disabled()"
  (click)="!disabled() && btnClick.emit()"
  [class]="'w-full py-2 px-6 rounded-full font-semibold transition-all duration-300 text-lg flex justify-center items-center ' + 
    (disabled() 
      ? 'bg-[#EFEFEF] text-[#9A9A9A] border border-[#EFEFEF] cursor-not-allowed shadow-none' 
      : 'bg-[--main-color] text-white border border-[--main-color] hover:opacity-90 shadow-lg shadow-orange-950/20')"
>
  {{ label() }}
</button>
